name: JumpDetector Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    name: JumpDetector Regression Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: |
            Kiters/Tools/JumpReplay/.build
            engines/engine_v16/.build
          key: ${{ runner.os }}-jumpreplay-${{ hashFiles('Kiters/Tools/JumpReplay/Sources/**/*.swift', 'Kiters/Tools/JumpReplay/Package.swift', 'engines/engine_v16/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-jumpreplay-

      - name: Run V16 rule tests
        run: swift test --package-path engines/engine_v16

      - name: Run replay regression tests
        run: |
          chmod +x Kiters/Tools/JumpReplay/verify.sh
          Kiters/Tools/JumpReplay/verify.sh

      - name: Upload actual outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: actual-outputs-${{ github.run_id }}
          path: Kiters/Tools/JumpReplay/output/*.actual.json
          retention-days: 7
